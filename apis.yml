aid: lendo
name: Lendo
description: 'Lendo (شركة ليندو السعودية للتمويل) is a Riyadh-based Saudi fintech licensed
  by the Saudi Central Bank (SAMA, License No. 61/A SH/202203, capital SAR 50M) that
  operates the Kingdom''s first SAMA-licensed Sharia-compliant debt-based crowdfunding
  platform. Lendo connects small and medium enterprises needing liquidity with retail
  and institutional investors, offering invoice financing, working capital financing,
  purchase-order financing and term loans funded within 48 hours of document completion,
  alongside government-backed programs with Monshaat, SME Bank, the Tourism Development
  Fund, the Cultural Development Fund, Modon and the Kafala guarantee scheme. On the
  investor side it runs tiered retail products (Basic, Premium, High Net Worth), an
  auto-invest engine and an A-D credit scoring engine, reporting SAR 4.5B+ in cumulative
  financing across 10,000+ funded deals at a 2.93% overall default rate. Lendo publishes
  no public developer program, API documentation or SDKs; its production API host is
  authentication-gated and its machine-readable public surface is limited to an llms.txt
  and a SafeBase-hosted trust center.'
