    bilingual (Arabic/English) JSON envelope, but every path responds 401/403 without
    a bearer token. Lendo publishes no public developer portal, API reference, OpenAPI
    definition or partner integration documentation, so this API is recorded as a private,
    undocumented surface rather than a consumable public API.'
